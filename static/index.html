<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>JeevanSetu </title>

  <link
    rel="stylesheet"
    href="/static/style.css"
  >
</head>


<body>

  <main class="phone-shell">

    <header>

      <div class="avatar">
        J
      </div>

      <div class="header-copy">

        <h1>
          JeevanSetu 
        </h1>

        <p id="status">
          Health assistant • online
        </p>

      </div>


      <button
        id="resetButton"
        class="header-button"
        type="button"
        title="Restart chat"
      >
        ↻
      </button>

    </header>


    <section
      id="messages"
      class="messages"
      aria-live="polite"
    >
    </section>


    <form
      id="composer"
      class="composer"
    >

      <input
        id="messageInput"
        maxlength="2000"
        placeholder="Type a health question"
        autocomplete="off"
        required
      >


      <button
        id="voiceButton"
        class="voice-button"
        type="button"
        aria-label="Speak your question"
        title="Speak your question"
      >
        🎙
      </button>


      <button
        type="submit"
        aria-label="Send message"
      >
        ➤
      </button>

    </form>


    <footer id="footerText">
      AI health information only — not a diagnosis.
      For emergencies, call 112.
    </footer>

  </main>


  <script src="/static/chat.js"></script>

</body>

</html>
